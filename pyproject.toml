[project]
name = "tasktracker"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps"]
addopts = "--cov=apps --cov-report=term-missing --cov-report=xml"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter/line-length, avoid noisy duplicate errors
]
